aid: mystars
name: MyStars FaaS
description: >-
  MyStars FaaS is a public B2B fulfilment API for buying and reselling Telegram Stars and Telegram
  Premium, delivered to any Telegram @username and settled on-chain in GRAM (ex TON) or USDT on
  the TON network. Integrators quote an all-in price, check that a recipient can receive the item,
  create an idempotent order, and pay the returned treasury address with the order id as the
  transfer memo; MyStars fulfils the delivery through Fragment and confirms it with an
  HMAC-signed webhook. The model is non-custodial and no-KYC — there is no prepaid balance and no
  card processor, and a flat 5% margin is already included in every quote. Official TypeScript and
  Python SDKs, plus a CLI, ship on npm and PyPI.
