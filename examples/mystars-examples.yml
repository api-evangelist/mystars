    label: TypeScript SDK
    source: "import { MyStarsClient } from \"@mystars-tg/faas-sdk\";\n\nconst client = MyStarsClient.production(process.env.MYSTARS_API_KEY!);\n\
      \n// Auto-paginating async iterator — the cursor is handled for you.\nfor await (const order of\
      \ client.listOrders({ status: \"awaiting_payment\", limit: 50 })) {\n  console.log(order.order_id,\
      \ order.status);\n}\n"
  - lang: python
    label: Python SDK
    source: "import os\n\nfrom mystars_faas import MyStarsClient\n\nclient = MyStarsClient.production(os.environ[\"\
      MYSTARS_API_KEY\"])\n\npage = client.list_orders(status=\"awaiting_payment\", limit=50)\nfor order\
      \ in page.orders:\n    print(order.order_id, order.status)\n# page.next_cursor → pass back as cursor=\
      \ for the next page (None = last).\n"
