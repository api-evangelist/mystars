- operationId: createOrder
  method: POST
  path: /v1/orders
  request_examples:
  - name: stars
    summary: 500 Stars to @durov, paid in GRAM
    value:
      type: stars
      recipient:
        username: durov
      quantity: 500
      payment_currency: ton
      callback_url: https://example.com/webhooks/mystars
  - name: premium
    summary: 3 months of Premium, paid in USDT
    value:
      type: premium
      recipient:
        username: durov
      months: 3
      payment_currency: usdt_ton
  code_samples:
  - lang: shell
    label: cURL
    source: "curl -X POST https://api.mystars.tg/v1/orders \\\n  -H \"X-Api-Key: $MYSTARS_API_KEY\" \\\
      \n  -H \"Idempotency-Key: $(uuidgen)\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"\
      type\":\"stars\",\"recipient\":{\"username\":\"durov\"},\"quantity\":500,\"payment_currency\":\"\
      ton\"}'\n"
  - lang: typescript
    label: TypeScript SDK
    source: "import { MyStarsClient } from \"@mystars-tg/faas-sdk\";\n\nconst client = MyStarsClient.production(process.env.MYSTARS_API_KEY!);\n\
      \n// Pass a STABLE idempotencyKey = your own order id so a retry returns\n// the SAME order instead\
      \ of creating a duplicate.\nconst order = await client.createOrder(\n  { type: \"stars\", recipient:\
      \ { username: \"durov\" }, quantity: 500, payment_currency: \"ton\" },\n  { idempotencyKey: `order-${myOrderId}`\
      \ },\n);\nconsole.log(order.payment); // amount, pay_to_address, memo\n"
  - lang: python
    label: Python SDK
    source: "import os\n\nfrom mystars_faas import MyStarsClient\n\nclient = MyStarsClient.production(os.environ[\"\
      MYSTARS_API_KEY\"])\n\n# Pass a STABLE idempotency_key = your own order id so a retry returns\n\
      # the SAME order instead of creating a duplicate.\norder = client.create_order(\n    type=\"stars\"\
      ,\n    recipient=\"durov\",\n    quantity=500,\n    payment_currency=\"ton\",\n    idempotency_key=f\"\
      order-{my_order_id}\",\n)\nprint(order.payment)  # amount, pay_to_address, memo\n"
  - lang: python
    label: Python (HTTP)
    source: "import uuid\n\nimport requests\n\nresp = requests.post(\n    \"https://api.mystars.tg/v1/orders\"\
      ,\n    headers={\n        \"X-Api-Key\": MYSTARS_API_KEY,\n        \"Idempotency-Key\": str(uuid.uuid4()),\n\
      \    },\n    json={\n        \"type\": \"stars\",\n        \"recipient\": {\"username\": \"durov\"\
      },\n        \"quantity\": 500,\n        \"payment_currency\": \"ton\",\n    },\n)\nresp.raise_for_status()\n\
      print(resp.json())\n"
- operationId: listOrders
  method: GET
