authentication_if_built:
  scheme: api-key
  header: X-Api-Key
  note: >-
    A server would carry one tenant key. The key alone cannot move funds — every order is settled
    by its own on-chain payment — but it CAN create orders, read order history and cancel unpaid
    orders, so it is a write credential.
